[workspace]
resolver = "2"
members = ["crates/emesh-core", "crates/emesh-lua", "crates/emesh-mesh", "crates/emesh-app", "crates/emesh-cli"]

[workspace.package]
version = "0.7.0-pre.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/huntsman33/Eilmer-Meshing-GUI"
authors = ["Jack Dwyer"]

[workspace.dependencies]
emesh-core = { path = "crates/emesh-core" }
emesh-lua = { path = "crates/emesh-lua" }
emesh-mesh = { path = "crates/emesh-mesh" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# The numerics follow the Python reference operation by operation (bit-for-bit parity):
# `!(x > 0.0)` keeps NaN behaviour, and indexed loops mirror the numpy expressions.
neg_cmp_op_on_partial_ord = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
